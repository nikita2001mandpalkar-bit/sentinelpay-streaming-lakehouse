<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">SentinelPay Streaming Lakehouse Architecture</title>
  <desc id="desc">A polished architecture diagram for the SentinelPay streaming lakehouse, showing source systems, Kafka ingestion, Bronze Silver Gold Delta layers on MinIO, quality controls, dbt analytics, Airflow orchestration, and downstream consumption.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1e8"/>
      <stop offset="100%" stop-color="#ffd9bf"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fbfd"/>
      <stop offset="100%" stop-color="#dfe7ef"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9da"/>
      <stop offset="100%" stop-color="#ffe79a"/>
    </linearGradient>
    <linearGradient id="dbtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .page { fill: url(#bgGrad); }
      .lane { fill: rgba(255,255,255,0.72); stroke: #d7e3f1; stroke-width: 1.5; }
      .title { font: 700 38px Arial, sans-serif; fill: #112240; }
      .subtitle { font: 500 17px Arial, sans-serif; fill: #52637a; }
      .pill { fill: #ffffff; stroke: #d5e3f3; stroke-width: 1.3; }
      .pill-text { font: 700 13px Arial, sans-serif; fill: #31506f; letter-spacing: 0.5px; }
      .section { font: 700 18px Arial, sans-serif; fill: #17324d; }
      .card-title { font: 700 20px Arial, sans-serif; fill: #10253d; }
      .card-text { font: 500 14px Arial, sans-serif; fill: #42556f; }
      .card-small { font: 600 12px Arial, sans-serif; fill: #5f728a; letter-spacing: 0.5px; }
      .source-card { fill: #ffffff; stroke: #c8d7e8; stroke-width: 1.7; }
      .kafka-card { fill: #fff1b7; stroke: #d89a17; stroke-width: 2.2; }
      .bronze-card { fill: url(#bronzeGrad); stroke: #c96e1a; stroke-width: 2.2; }
      .silver-card { fill: url(#silverGrad); stroke: #64748b; stroke-width: 2.2; }
      .gold-card { fill: url(#goldGrad); stroke: #ca8a04; stroke-width: 2.2; }
      .quality-card { fill: #e8fff0; stroke: #1f8c5d; stroke-width: 2.2; }
      .risk-card { fill: #fff0f0; stroke: #dc4a4a; stroke-width: 2.2; }
      .dbt-card { fill: url(#dbtGrad); stroke: #2f6fed; stroke-width: 2.2; }
      .analytics-card { fill: #e6fbff; stroke: #0f8b99; stroke-width: 2.2; }
      .airflow-band { fill: #f2ebff; stroke: #8759e2; stroke-width: 2.2; }
      .dot-source { fill: #4f7aa6; }
      .dot-kafka { fill: #d89a17; }
      .dot-bronze { fill: #c96e1a; }
      .dot-silver { fill: #64748b; }
      .dot-gold { fill: #ca8a04; }
      .dot-quality { fill: #1f8c5d; }
      .dot-dbt { fill: #2f6fed; }
      .dot-airflow { fill: #8759e2; }
      .arrow { stroke: #37506c; stroke-width: 3.2; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 10 8; stroke: #8759e2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#37506c"/>
    </marker>
  </defs>

  <rect class="page" width="1800" height="1080"/>

  <text class="title" x="58" y="64">SentinelPay Streaming Lakehouse Architecture</text>
  <text class="subtitle" x="58" y="96">Production-style streaming data platform for payment, refund, log, and support workflows</text>

  <rect class="pill" x="58" y="118" rx="18" ry="18" width="126" height="34"/>
  <text class="pill-text" x="87" y="140">KAFKA</text>
  <rect class="pill" x="196" y="118" rx="18" ry="18" width="134" height="34"/>
  <text class="pill-text" x="224" y="140">PYSPARK</text>
  <rect class="pill" x="344" y="118" rx="18" ry="18" width="162" height="34"/>
  <text class="pill-text" x="374" y="140">DELTA LAKE</text>
  <rect class="pill" x="520" y="118" rx="18" ry="18" width="126" height="34"/>
  <text class="pill-text" x="546" y="140">MINIO</text>
  <rect class="pill" x="660" y="118" rx="18" ry="18" width="136" height="34"/>
  <text class="pill-text" x="685" y="140">AIRFLOW</text>
  <rect class="pill" x="810" y="118" rx="18" ry="18" width="210" height="34"/>
  <text class="pill-text" x="838" y="140">GREAT EXPECTATIONS</text>
  <rect class="pill" x="1034" y="118" rx="18" ry="18" width="100" height="34"/>
  <text class="pill-text" x="1067" y="140">DBT</text>

  <rect class="lane" x="45" y="185" rx="26" ry="26" width="300" height="635" filter="url(#softShadow)"/>
  <rect class="lane" x="375" y="185" rx="26" ry="26" width="265" height="635" filter="url(#softShadow)"/>
  <rect class="lane" x="670" y="185" rx="26" ry="26" width="345" height="635" filter="url(#softShadow)"/>
  <rect class="lane" x="1045" y="185" rx="26" ry="26" width="290" height="635" filter="url(#softShadow)"/>
  <rect class="lane" x="1365" y="185" rx="26" ry="26" width="390" height="635" filter="url(#softShadow)"/>

  <text class="section" x="72" y="220">1. Source Systems</text>
  <text class="section" x="405" y="220">2. Streaming Ingestion</text>
  <text class="section" x="697" y="220">3. Lakehouse Processing</text>
  <text class="section" x="1072" y="220">4. Quality Controls</text>
  <text class="section" x="1392" y="220">5. Analytics Delivery</text>

  <g filter="url(#softShadow)">
    <rect class="source-card" x="72" y="250" rx="22" ry="22" width="245" height="104"/>
    <circle class="dot-source" cx="104" cy="298" r="10"/>
    <text class="card-title" x="124" y="289">PostgreSQL Extracts</text>
    <text class="card-text" x="124" y="317">Reference and master inputs</text>
    <text class="card-small" x="124" y="339">BATCH + REFERENCE</text>

    <rect class="source-card" x="72" y="376" rx="22" ry="22" width="245" height="104"/>
    <circle class="dot-source" cx="104" cy="424" r="10"/>
    <text class="card-title" x="124" y="415">JSON Payment Events</text>
    <text class="card-text" x="124" y="443">Transactional event stream</text>
    <text class="card-small" x="124" y="465">REAL-TIME INGESTION</text>

    <rect class="source-card" x="72" y="502" rx="22" ry="22" width="245" height="104"/>
    <circle class="dot-source" cx="104" cy="550" r="10"/>
    <text class="card-title" x="124" y="541">Application Logs</text>
    <text class="card-text" x="124" y="569">Operational logging events</text>
    <text class="card-small" x="124" y="591">OPS OBSERVABILITY DATA</text>

    <rect class="source-card" x="72" y="628" rx="22" ry="22" width="245" height="104"/>
    <circle class="dot-source" cx="104" cy="676" r="10"/>
    <text class="card-title" x="124" y="667">Support Tickets</text>
    <text class="card-text" x="124" y="695">Customer issue workflow data</text>
    <text class="card-small" x="124" y="717">SUPPORT EVENTS</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="kafka-card" x="412" y="320" rx="28" ry="28" width="190" height="260"/>
    <circle class="dot-kafka" cx="442" cy="368" r="11"/>
    <text class="card-title" x="463" y="374">Apache Kafka</text>
    <text class="card-text" x="442" y="420">Topic-based event transport</text>
    <text class="card-text" x="442" y="454">event_payment</text>
    <text class="card-text" x="442" y="482">event_refund</text>
    <text class="card-text" x="442" y="510">log_support_ticket</text>
    <text class="card-text" x="442" y="538">master/reference feeds</text>
    <text class="card-small" x="442" y="566">HIGH-THROUGHPUT INGESTION</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="bronze-card" x="706" y="250" rx="24" ry="24" width="270" height="150"/>
    <circle class="dot-bronze" cx="738" cy="298" r="11"/>
    <text class="card-title" x="760" y="304">Bronze Layer</text>
    <text class="card-text" x="738" y="338">PySpark Structured Streaming</text>
    <text class="card-text" x="738" y="364">Raw Delta ingestion on MinIO</text>
    <text class="card-small" x="738" y="388">RAW + APPEND-ORIENTED</text>

    <rect class="silver-card" x="706" y="440" rx="24" ry="24" width="270" height="195"/>
    <circle class="dot-silver" cx="738" cy="488" r="11"/>
    <text class="card-title" x="760" y="494">Silver Layer</text>
    <text class="card-text" x="738" y="528">Validation and cleansing</text>
    <text class="card-text" x="738" y="554">Deduplication</text>
    <text class="card-text" x="738" y="580">Watermarking and late-event handling</text>
    <text class="card-text" x="738" y="606">Idempotent Delta writes</text>
    <text class="card-small" x="738" y="628">CURATED + TRUSTED DATA</text>

    <rect class="gold-card" x="706" y="675" rx="24" ry="24" width="270" height="145"/>
    <circle class="dot-gold" cx="738" cy="721" r="11"/>
    <text class="card-title" x="760" y="727">Gold Layer</text>
    <text class="card-text" x="738" y="761">Business-ready Delta datasets</text>
    <text class="card-text" x="738" y="787">Analytics and consumption outputs</text>
    <text class="card-small" x="738" y="810">SERVING LAYER</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="quality-card" x="1083" y="285" rx="24" ry="24" width="215" height="150"/>
    <circle class="dot-quality" cx="1115" cy="333" r="11"/>
