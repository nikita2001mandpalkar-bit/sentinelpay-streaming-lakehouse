<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">SentinelPay Streaming Lakehouse Architecture</title>
  <desc id="desc">Architecture diagram showing SentinelPay source systems, Kafka ingestion, Bronze Silver Gold Delta Lake layers on MinIO, Great Expectations quality controls, Apache Airflow orchestration, dbt analytics, reconciliation, and merchant SCD Type 2 outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1e8"/>
      <stop offset="100%" stop-color="#ffd7bd"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbfd"/>
      <stop offset="100%" stop-color="#dee7f0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9d8"/>
      <stop offset="100%" stop-color="#ffe38a"/>
    </linearGradient>
    <linearGradient id="dbt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dbe8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .page { fill: url(#bg); }
      .frame { fill: rgba(255,255,255,0.78); stroke: #d7e3f2; stroke-width: 1.5; }
      .header { font: 700 42px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #10243d; }
      .subheader { font: 500 17px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #53657f; }
      .section { font: 700 20px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #17324d; }
      .cardTitle { font: 700 20px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #10243d; }
      .cardText { font: 500 14px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #42556f; }
      .cardNote { font: 700 11px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #5f728a; letter-spacing: 0.8px; }
      .badge { fill: #ffffff; stroke: #d3e0ef; stroke-width: 1.2; }
      .badgeText { font: 700 13px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #2f4f70; letter-spacing: 0.4px; }
      .source { fill: #ffffff; stroke: #c7d7e8; stroke-width: 1.7; }
      .kafka { fill: #fff2c1; stroke: #d59416; stroke-width: 2.1; }
      .bronze { fill: url(#bronze); stroke: #c96a20; stroke-width: 2.1; }
      .silver { fill: url(#silver); stroke: #69788b; stroke-width: 2.1; }
      .gold { fill: url(#gold); stroke: #c79200; stroke-width: 2.1; }
      .quality { fill: #e9fbef; stroke: #18814d; stroke-width: 2.1; }
      .risk { fill: #fff0f0; stroke: #d34343; stroke-width: 2.1; }
      .dbt { fill: url(#dbt); stroke: #2c68e8; stroke-width: 2.1; }
      .output { fill: #e8fbff; stroke: #0f8d9c; stroke-width: 2.1; }
      .airflow { fill: #f5edff; stroke: #8b5cf6; stroke-width: 2.1; }
      .dotSource { fill: #47719d; }
      .dotKafka { fill: #d59416; }
      .dotBronze { fill: #c96a20; }
      .dotSilver { fill: #69788b; }
      .dotGold { fill: #c79200; }
      .dotQuality { fill: #18814d; }
      .dotDbt { fill: #2c68e8; }
      .dotOutput { fill: #0f8d9c; }
      .dotAirflow { fill: #8b5cf6; }
      .arrow { stroke: #39536f; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .orchestrates { stroke: #8b5cf6; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrowheadPurple); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#39536f"/>
    </marker>
    <marker id="arrowheadPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect class="page" width="1800" height="1180"/>

  <text class="header" x="56" y="68">SentinelPay Streaming Lakehouse Architecture</text>
  <text class="subheader" x="56" y="99">Fintech data platform for payment events, refunds, settlements, quality enforcement, reconciliation, and merchant history tracking</text>

  <rect class="badge" x="56" y="122" rx="18" ry="18" width="118" height="34"/>
  <text class="badgeText" x="86" y="144">KAFKA</text>
  <rect class="badge" x="186" y="122" rx="18" ry="18" width="138" height="34"/>
  <text class="badgeText" x="213" y="144">PYSPARK</text>
  <rect class="badge" x="338" y="122" rx="18" ry="18" width="164" height="34"/>
  <text class="badgeText" x="367" y="144">DELTA LAKE</text>
  <rect class="badge" x="516" y="122" rx="18" ry="18" width="118" height="34"/>
  <text class="badgeText" x="545" y="144">MINIO</text>
  <rect class="badge" x="648" y="122" rx="18" ry="18" width="138" height="34"/>
  <text class="badgeText" x="674" y="144">AIRFLOW</text>
  <rect class="badge" x="800" y="122" rx="18" ry="18" width="212" height="34"/>
  <text class="badgeText" x="828" y="144">GREAT EXPECTATIONS</text>
  <rect class="badge" x="1026" y="122" rx="18" ry="18" width="104" height="34"/>
  <text class="badgeText" x="1058" y="144">DBT</text>

  <rect class="frame" x="42" y="188" rx="24" ry="24" width="320" height="760" filter="url(#shadow)"/>
  <rect class="frame" x="388" y="188" rx="24" ry="24" width="310" height="760" filter="url(#shadow)"/>
  <rect class="frame" x="724" y="188" rx="24" ry="24" width="356" height="760" filter="url(#shadow)"/>
  <rect class="frame" x="1106" y="188" rx="24" ry="24" width="290" height="760" filter="url(#shadow)"/>
  <rect class="frame" x="1422" y="188" rx="24" ry="24" width="336" height="760" filter="url(#shadow)"/>

  <text class="section" x="68" y="222">1. Source Systems</text>
  <text class="section" x="414" y="222">2. Kafka and Bronze Ingestion</text>
  <text class="section" x="750" y="222">3. Silver and Gold Processing</text>
  <text class="section" x="1132" y="222">4. Quality Controls</text>
  <text class="section" x="1448" y="222">5. Analytics Delivery</text>

  <g filter="url(#shadow)">
    <rect class="source" x="68" y="256" rx="20" ry="20" width="266" height="118"/>
    <circle class="dotSource" cx="100" cy="306" r="10"/>
    <text class="cardTitle" x="120" y="299">PostgreSQL Tables</text>
    <text class="cardText" x="120" y="326">payments, refunds, settlements,</text>
    <text class="cardText" x="120" y="347">merchants, devices, bank accounts</text>
    <text class="cardNote" x="120" y="366">MASTER + TRANSACTIONAL INPUTS</text>

    <rect class="source" x="68" y="396" rx="20" ry="20" width="266" height="102"/>
    <circle class="dotSource" cx="100" cy="445" r="10"/>
    <text class="cardTitle" x="120" y="439">JSON Event Feeds</text>
    <text class="cardText" x="120" y="466">payment and refund event streams</text>
    <text class="cardNote" x="120" y="487">REAL-TIME EVENTS</text>

    <rect class="source" x="68" y="520" rx="20" ry="20" width="266" height="102"/>
    <circle class="dotSource" cx="100" cy="569" r="10"/>
    <text class="cardTitle" x="120" y="563">Application Logs</text>
    <text class="cardText" x="120" y="590">operational records and trace signals</text>
    <text class="cardNote" x="120" y="611">OBSERVABILITY DATA</text>

    <rect class="source" x="68" y="644" rx="20" ry="20" width="266" height="102"/>
    <circle class="dotSource" cx="100" cy="693" r="10"/>
    <text class="cardTitle" x="120" y="687">Support Tickets</text>
    <text class="cardText" x="120" y="714">customer issue lifecycle events</text>
    <text class="cardNote" x="120" y="735">SERVICE WORKFLOWS</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="kafka" x="422" y="258" rx="24" ry="24" width="244" height="180"/>
    <circle class="dotKafka" cx="454" cy="307" r="10"/>
    <text class="cardTitle" x="476" y="301">Kafka Topics</text>
    <text class="cardText" x="454" y="333">event.payment</text>
    <text class="cardText" x="454" y="359">event.refund</text>
    <text class="cardText" x="454" y="385">batch.settlement</text>
    <text class="cardText" x="454" y="411">log.support_ticket</text>
    <text class="cardText" x="454" y="437">master data feeds</text>

    <rect class="bronze" x="422" y="476" rx="24" ry="24" width="244" height="250"/>
    <circle class="dotBronze" cx="454" cy="525" r="10"/>
    <text class="cardTitle" x="476" y="519">Bronze Delta on MinIO</text>
    <text class="cardText" x="454" y="551">bronze_event_payment</text>
    <text class="cardText" x="454" y="577">bronze_event_refund</text>
    <text class="cardText" x="454" y="603">bronze_settlement</text>
    <text class="cardText" x="454" y="629">bronze_logs</text>
    <text class="cardText" x="454" y="655">bronze_master_data</text>
    <text class="cardText" x="454" y="681">checkpoint folders</text>
    <text class="cardNote" x="454" y="705">APPEND + RECOVERY-SAFE INGESTION</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="silver" x="758" y="258" rx="24" ry="24" width="290" height="268"/>
    <circle class="dotSilver" cx="790" cy="307" r="10"/>
    <text class="cardTitle" x="812" y="301">Silver Curated Layer</text>
    <text class="cardText" x="790" y="333">validated payment and refund streams</text>
    <text class="cardText" x="790" y="359">settlements, support tickets, devices,</text>
    <text class="cardText" x="790" y="385">and bank accounts</text>
    <text class="cardText" x="790" y="419">deduplication and idempotent writes</text>
    <text class="cardText" x="790" y="445">watermarking and late-event handling</text>
    <text class="cardNote" x="790" y="470">TRUSTED OPERATIONAL DATA</text>

    <rect class="gold" x="758" y="564" rx="24" ry="24" width="290" height="276"/>
    <circle class="dotGold" cx="790" cy="613" r="10"/>
    <text class="cardTitle" x="812" y="607">Gold Business Layer</text>
    <text class="cardText" x="790" y="639">gold_payment_summary</text>
    <text class="cardText" x="790" y="665">gold_finance_reconciliation</text>
    <text class="cardText" x="790" y="691">gold_dim_merchant_scd</text>
    <text class="cardText" x="790" y="725">1M+ scale execution proof</text>
    <text class="cardText" x="790" y="751">matched, under-settled, and missing</text>
    <text class="cardText" x="790" y="777">settlement scenarios</text>
    <text class="cardNote" x="790" y="802">BUSINESS-READY OUTPUTS</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="quality" x="1140" y="258" rx="24" ry="24" width="222" height="154"/>
    <circle class="dotQuality" cx="1172" cy="307" r="10"/>
    <text class="cardTitle" x="1194" y="301">Great Expectations</text>
    <text class="cardText" x="1172" y="333">Silver-layer quality gate</text>
    <text class="cardText" x="1172" y="359">schema and business checks</text>
    <text class="cardNote" x="1172" y="383">QUALITY ENFORCEMENT</text>

    <rect class="risk" x="1140" y="444" rx="24" ry="24" width="222" height="128"/>
    <circle cx="1172" cy="493" r="10" fill="#d34343"/>
    <text class="cardTitle" x="1194" y="487">Quarantine</text>
    <text class="cardText" x="1172" y="519">invalid or rejected records</text>
    <text class="cardNote" x="1172" y="543">FAIL-SAFE ISOLATION</text>

    <rect class="quality" x="1140" y="604" rx="24" ry="24" width="222" height="128"/>
    <circle class="dotQuality" cx="1172" cy="653" r="10"/>
    <text class="cardTitle" x="1194" y="647">Checkpoint Recovery</text>
    <text class="cardText" x="1172" y="679">restart-safe stream continuity</text>
    <text class="cardNote" x="1172" y="703">FAULT TOLERANCE</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="dbt" x="1456" y="258" rx="24" ry="24" width="268" height="214"/>
    <circle class="dotDbt" cx="1488" cy="307" r="10"/>
    <text class="cardTitle" x="1510" y="301">dbt Analytics Layer</text>
    <text class="cardText" x="1488" y="333">staging models over Silver data</text>
    <text class="cardText" x="1488" y="359">marts for payment, refund,</text>
    <text class="cardText" x="1488" y="385">support, and finance analytics</text>
    <text class="cardText" x="1488" y="411">docs and lineage for trust</text>
    <text class="cardNote" x="1488" y="435">CURATED ANALYTICS</text>

    <rect class="output" x="1456" y="512" rx="24" ry="24" width="268" height="176"/>
    <circle class="dotOutput" cx="1488" cy="561" r="10"/>
    <text class="cardTitle" x="1510" y="555">Consumers and Proof</text>
    <text class="cardText" x="1488" y="587">analysts and downstream reports</text>
    <text class="cardText" x="1488" y="613">GitHub screenshots and demos</text>
    <text class="cardText" x="1488" y="639">recruiter-ready project evidence</text>
    <text class="cardNote" x="1488" y="662">DELIVERY + SHOWCASE</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="airflow" x="244" y="996" rx="28" ry="28" width="1312" height="116"/>
    <circle class="dotAirflow" cx="288" cy="1053" r="11"/>
    <text class="cardTitle" x="312" y="1048">Apache Airflow Orchestration</text>
    <text class="cardText" x="540" y="1048">Streaming Control DAG</text>
    <text class="cardText" x="752" y="1048">Quality Gate DAG</text>
    <text class="cardText" x="936" y="1048">Gold Pipeline DAG</text>
    <text class="cardText" x="1110" y="1048">dbt Pipeline DAG</text>
    <text class="cardText" x="1268" y="1048">Main Pipeline</text>
  </g>

