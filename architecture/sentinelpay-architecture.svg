    <text class="card-text" x="1115" y="373">Quality checks and validation rules</text>
    <text class="card-text" x="1115" y="399">Airflow quality-gate execution</text>
    <text class="card-small" x="1115" y="422">DATA CONTRACT ENFORCEMENT</text>

    <rect class="risk-card" x="1083" y="475" rx="24" ry="24" width="215" height="125"/>
    <circle cx="1115" cy="523" r="11" fill="#dc4a4a"/>
    <text class="card-title" x="1138" y="529">Quarantine</text>
    <text class="card-text" x="1115" y="563">Invalid and failed records</text>
    <text class="card-small" x="1115" y="586">FAIL-SAFE ISOLATION</text>

    <rect class="quality-card" x="1083" y="640" rx="24" ry="24" width="215" height="125"/>
    <circle class="dot-quality" cx="1115" cy="688" r="11"/>
    <text class="card-title" x="1138" y="694">Checkpoint Recovery</text>
    <text class="card-text" x="1115" y="728">Restart-safe streaming state</text>
    <text class="card-small" x="1115" y="751">FAULT TOLERANCE</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="dbt-card" x="1400" y="272" rx="24" ry="24" width="320" height="170"/>
    <circle class="dot-dbt" cx="1432" cy="320" r="11"/>
    <text class="card-title" x="1454" y="326">dbt Transformation Layer</text>
    <text class="card-text" x="1432" y="360">Staging models for curated Silver views</text>
    <text class="card-text" x="1432" y="386">Mart models for payment, refund, support</text>
    <text class="card-text" x="1432" y="412">Docs and lineage for downstream trust</text>
    <text class="card-small" x="1432" y="434">ANALYTICS MODELING</text>

    <rect class="analytics-card" x="1400" y="500" rx="24" ry="24" width="320" height="160"/>
    <circle cx="1432" cy="548" r="11" fill="#0f8b99"/>
    <text class="card-title" x="1454" y="554">Analytics and Reporting</text>
    <text class="card-text" x="1432" y="588">Payment summary marts</text>
    <text class="card-text" x="1432" y="614">Refund and support ticket insights</text>
    <text class="card-text" x="1432" y="640">Documented downstream consumption</text>
    <text class="card-small" x="1432" y="662">BUSINESS CONSUMPTION</text>
  </g>

  <g filter="url(#softShadow)">
    <rect class="airflow-band" x="255" y="890" rx="28" ry="28" width="1290" height="120"/>
    <circle class="dot-airflow" cx="300" cy="948" r="12"/>
    <text class="card-title" x="326" y="955">Apache Airflow Orchestration</text>
    <text class="card-text" x="510" y="955">Streaming Control DAG</text>
    <text class="card-text" x="712" y="955">Quality Gate DAG</text>
    <text class="card-text" x="884" y="955">Gold Pipeline DAG</text>
    <text class="card-text" x="1062" y="955">dbt Pipeline DAG</text>
    <text class="card-text" x="1228" y="955">Main Pipeline DAG</text>
  </g>

