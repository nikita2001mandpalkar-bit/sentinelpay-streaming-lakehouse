<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">SentinelPay Clean Architecture</title>
  <desc id="desc">Clean boxed architecture diagram for SentinelPay showing source systems, Kafka ingestion, Bronze Silver Gold Delta Lake on MinIO, PySpark processing, Great Expectations quality controls, dbt analytics, Airflow orchestration, and proof surfaces.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#71829a"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 34px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 500 17px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #394b63; }
      .small { font: 500 14px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #51657d; }
      .note { font: 600 12px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #687b93; letter-spacing: 0.6px; }
      .section { font: 600 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #2e4158; }
      .boxTitle { font: 700 18px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #20324a; }
      .boxText { font: 500 14px 'Avenir Next', 'Segoe UI', Arial, sans-serif; fill: #41556f; }
      .outer { fill: none; stroke: #222; stroke-width: 1.4; stroke-dasharray: 8 6; }
      .card { fill: #ffffff; stroke: #cfd7e3; stroke-width: 1.4; }
      .lake { fill: none; stroke: #9fc38d; stroke-width: 1.4; }
      .bronze { fill: #fff3ea; stroke: #efcfba; stroke-width: 1.2; }
      .silver { fill: #f7f9fb; stroke: #d9e0e8; stroke-width: 1.2; }
      .gold { fill: #fff8dc; stroke: #ecd88d; stroke-width: 1.2; }
      .proc { fill: #ffffff; stroke: #d8dfeb; stroke-width: 1.2; }
      .catalog { fill: #ffffff; stroke: #d8dfeb; stroke-width: 1.2; }
      .accentBlue { fill: #2f6fe6; }
      .accentGreen { fill: #1f8c5c; }
      .accentOrange { fill: #cf6d21; }
      .accentGold { fill: #c79a00; }
      .accentPurple { fill: #8b5ce6; }
      .accentTeal { fill: #1392a4; }
      .accentRed { fill: #d84a4a; }
      .line { stroke: #71829a; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9b7ae8; stroke-width: 2.4; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1120"/>

  <text class="title" x="76" y="86">SentinelPay Data Architecture</text>

  <text class="section" x="84" y="330">Source</text>
  <rect class="card" x="66" y="350" width="164" height="80"/>
  <text class="boxTitle" x="109" y="386">Source Systems</text>
  <text class="boxText" x="98" y="412">PostgreSQL, JSON, logs,</text>
  <text class="boxText" x="110" y="432">support tickets</text>

  <rect class="card" x="260" y="330" width="192" height="120"/>
  <circle class="accentOrange" cx="295" cy="372" r="16"/>
  <text class="boxTitle" x="324" y="368">Kafka Ingestion</text>
  <text class="boxText" x="324" y="394">event.payment</text>
  <text class="boxText" x="324" y="416">event.refund, settlements,</text>
  <text class="boxText" x="324" y="438">support and master feeds</text>

  <rect class="outer" x="388" y="132" width="1018" height="720"/>
  <text class="section" x="402" y="156">Data Platform</text>

  <text class="section" x="1214" y="112">Access Control</text>
  <rect class="card" x="1226" y="52" width="120" height="62"/>
  <circle class="accentRed" cx="1254" cy="83" r="12"/>
  <text class="boxText" x="1276" y="78">IAM-style</text>
  <text class="boxText" x="1276" y="98">access roles</text>

  <rect class="lake" x="450" y="176" width="740" height="320"/>
  <text class="section" x="464" y="200">Lakehouse on MinIO</text>

  <rect class="bronze" x="478" y="228" width="204" height="212"/>
  <circle class="accentOrange" cx="580" cy="276" r="22"/>
  <text class="boxTitle" x="544" y="316">Bronze</text>
  <text class="boxText" x="524" y="344">Raw Delta ingestion</text>
  <text class="boxText" x="514" y="370">payment, refund, logs,</text>
  <text class="boxText" x="523" y="392">settlement, master data</text>
  <text class="note" x="520" y="420">LANDING AREA</text>

  <rect class="silver" x="718" y="228" width="204" height="212"/>
  <circle class="accentBlue" cx="820" cy="276" r="22"/>
  <text class="boxTitle" x="781" y="316">Silver</text>
  <text class="boxText" x="751" y="344">Validated and deduped</text>
  <text class="boxText" x="760" y="370">watermarked curated</text>
  <text class="boxText" x="758" y="392">business-ready entities</text>
  <text class="note" x="734" y="420">CLEANSED / ENRICHED</text>

  <rect class="gold" x="958" y="228" width="204" height="212"/>
  <circle class="accentGold" cx="1060" cy="276" r="22"/>
  <text class="boxTitle" x="1026" y="316">Gold</text>
  <text class="boxText" x="989" y="344">Payment summary</text>
  <text class="boxText" x="980" y="370">finance reconciliation</text>
  <text class="boxText" x="984" y="392">merchant SCD Type 2</text>
  <text class="note" x="987" y="420">ANALYTICS / REPORTING</text>

  <rect class="proc" x="474" y="536" width="690" height="112"/>
  <circle class="accentOrange" cx="526" cy="592" r="16"/>
  <text class="boxTitle" x="558" y="586">Data Processing</text>
  <text class="boxText" x="558" y="612">Kafka consumers, PySpark Structured Streaming, and Airflow orchestration</text>
  <circle class="accentBlue" cx="976" cy="592" r="16"/>
  <circle class="accentPurple" cx="1040" cy="592" r="16"/>
  <circle class="accentGreen" cx="1104" cy="592" r="16"/>

  <rect class="catalog" x="474" y="672" width="690" height="120"/>
  <circle class="accentPurple" cx="526" cy="728" r="16"/>
  <text class="boxTitle" x="558" y="722">Catalogue, Quality, and Classification</text>
  <text class="boxText" x="558" y="748">dbt staging and marts, docs and lineage, Great Expectations, quarantine, checkpoint recovery</text>

  <rect class="card" x="1282" y="286" width="180" height="74"/>
  <text class="boxTitle" x="1341" y="328">API</text>
  <rect class="card" x="1282" y="386" width="180" height="74"/>
  <text class="boxTitle" x="1320" y="428">Analytical Access</text>
  <rect class="card" x="1282" y="488" width="180" height="74"/>
  <circle class="accentTeal" cx="1316" cy="525" r="14"/>
  <text class="boxTitle" x="1340" y="520">MinIO / SQL /</text>
  <text class="boxTitle" x="1340" y="542">GitHub access</text>

  <rect class="card" x="1540" y="110" width="176" height="154"/>
  <text class="note" x="1560" y="136">MONITORING / PROOF</text>
  <circle class="accentTeal" cx="1580" cy="184" r="16"/>
  <text class="boxText" x="1608" y="179">Spark UI</text>
  <circle class="accentGreen" cx="1580" cy="222" r="16"/>
  <text class="boxText" x="1608" y="217">Airflow UI</text>
  <text class="boxText" x="1608" y="239">job and DAG proof</text>

  <rect class="card" x="1540" y="300" width="176" height="364"/>
  <text class="note" x="1572" y="326">TARGET SYSTEMS</text>
  <text class="boxTitle" x="1589" y="364">Analytics</text>
  <circle class="accentPurple" cx="1580" cy="414" r="16"/>
  <text class="boxText" x="1608" y="409">dbt docs</text>
  <circle class="accentBlue" cx="1580" cy="468" r="16"/>
  <text class="boxText" x="1608" y="463">Spark SQL</text>
  <circle class="accentGold" cx="1580" cy="522" r="16"/>
  <text class="boxText" x="1608" y="517">Gold tables</text>
  <circle class="accentTeal" cx="1580" cy="576" r="16"/>
  <text class="boxText" x="1608" y="571">GitHub proof</text>
  <text class="boxText" x="1608" y="593">README and screenshots</text>

  <path class="line" d="M230 390 L260 390"/>
  <path class="line" d="M452 390 L478 390"/>
  <path class="line" d="M682 334 L718 334"/>
  <path class="line" d="M922 334 L958 334"/>
  <path class="line" d="M1162 334 L1282 334"/>
  <path class="line" d="M1162 536 L1282 536"/>
  <path class="line" d="M1462 424 L1540 424"/>
  <path class="line" d="M1462 525 L1540 525"/>

  <path class="dash" d="M820 648 L820 672"/>
  <path class="dash" d="M1060 440 L1060 536"/>

  <path class="line" d="M580 440 L580 536"/>
  <path class="line" d="M820 440 L820 536"/>
  <path class="line" d="M1060 440 L1060 536"/>

  <text class="section" x="687" y="934">Data Flow</text>
  <path d="M164 972 H1468 L1468 940 L1538 990 L1468 1040 L1468 1008 H164 Z" fill="none" stroke="#b8c3d1" stroke-width="2"/>

  <text class="small" x="1218" y="1072">Not every access surface needs to be used in every demo.</text>
</svg>
